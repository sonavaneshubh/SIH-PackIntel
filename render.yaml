services:
  - type: web
    name: packintel-backend
    runtime: python
    rootDir: backend
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Set the deployed frontend origin here (e.g. https://packintel.vercel.app)
      # so the API's CORS allow-list includes the Vercel production domain.
      # All *.vercel.app preview URLs are already allowed via allow_origin_regex.
      - key: FRONTEND_URL
        sync: false