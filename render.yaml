services:
  - type: web
    name: packintel-backend
    runtime: python
    rootDir: backend
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Set the deployed frontend origin here (e.g. https://packintel.vercel.app)
      # so the API's CORS allow-list includes the Vercel production domain.
      # All *.vercel.app preview URLs are already allowed via allow_origin_regex.
      - key: FRONTEND_URL
        sync: false
      # Supabase Storage bucket that stores generated inspection reports. The
      # backend creates it automatically on startup if it is missing. Keep it
      # in sync with the bucket the frontend uses to upload reports.
      - key: REPORT_STORAGE_BUCKET
        sync: false
      # ── OCR / Vision configuration ──────────────────────────────────────────
      # Gemini multimodal vision extraction (primary structured extractor).
      # Set GEMINI_API_KEY to a valid Google AI Studio / Vertex AI key.
      - key: VISION_PROVIDER
        value: gemini
      - key: VISION_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false
      # Enable Gemini Vision as the primary extraction engine: it reads the
      # label IMAGE directly (multimodal) and extracts structured fields,
      # independent of Google Cloud Vision OCR. Set to "true" once
      # GEMINI_API_KEY is configured so the pipeline uses Gemini first and
      # only falls back to GCV OCR → regex when Gemini fails.
      - key: GEMINI_PRIMARY_ENABLED
        value: "true"
      # Optional: re-arm the Gemini image-vision fallback for low-confidence OCR.
      - key: ENABLE_VISION_FALLBACK
        value: "true"
      - key: VISION_TIMEOUT_SECONDS
        value: "30"
      # Google Cloud Vision OCR (primary OCR engine). Requires the service
      # account JSON to be committed (backend/packintel-*.json) OR set
      # GOOGLE_APPLICATION_CREDENTIALS to the path of the key on the server.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      # Optional third-party OCR fallback (set key to enable OCR.Space).
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: OCR_TIMEOUT_SECONDS
        value: "60"
      # Tesseract is installed via buildCommand; no TESSERACT_CMD needed on
      # Linux/Render (it is on the system PATH after apt-get install).
